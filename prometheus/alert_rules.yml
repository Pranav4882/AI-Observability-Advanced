groups:
  - name: ai_observability_alerts
    rules:
      - alert: HighInferenceLatency
        expr: histogram_quantile(0.95, rate(prediction_latency_seconds_bucket[5m])) > 1
        for: 10s
        labels:
          severity: warning
        annotations:
          summary: "High inference latency detected"
          description: "P95 latency is {{ $value }}s (threshold: 1s)"

      - alert: LowModelConfidence
        expr: histogram_quantile(0.5, rate(prediction_confidence_bucket[5m])) < 0.5
        for: 10s
        labels:
          severity: warning
        annotations:
          summary: "Low model confidence detected"
          description: "Median confidence is {{ $value }}"

      - alert: DataDriftDetected
        expr: drift_detected == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Data drift detected"
          description: "PSI score: {{ $value }}"

      - alert: HighErrorRate
        expr: rate(prediction_requests_total{status="error"}[5m]) / rate(prediction_requests_total[5m]) > 0.1
        for: 10s
        labels:
          severity: critical
        annotations:
          summary: "High prediction error rate"
          description: "Error rate is {{ $value | humanizePercentage }}"

      - alert: HighCPUUsage
        expr: system_cpu_usage_percent > 90
        for: 10s
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is {{ $value }}%"
