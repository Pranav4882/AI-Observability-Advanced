global:
  scrape_interval: 2s
  evaluation_interval: 2s
  scrape_timeout: 2s

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: "ai-observability"
    metrics_path: "/metrics/prometheus"
    static_configs:
      - targets: ["ai-service:8000"]
        labels:
          service: "ai-observability"
          environment: "development"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
